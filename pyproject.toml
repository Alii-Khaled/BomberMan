[project]
name = "bomberman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alii-Khaled", email = "alii.khaled97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pygame>=2.6.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.0",
    "torch>=2.5.1,<2.6",
    "torchvision>=0.20.1,<0.21",
    "matplotlib>=3.10.0",
    "tensorboard>=2.19.0"
]

[project.scripts]
bomberman = "bomberman:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
